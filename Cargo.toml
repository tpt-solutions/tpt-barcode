[workspace]
members = [
    "crates/tpt-barcode-core",
    "crates/tpt-barcode-1d",
    "crates/tpt-barcode-2d",
    "crates/tpt-barcode-image",
    "crates/tpt-barcode-render",
    "crates/tpt-barcode",
]
exclude = [
    "fuzz",
    # wasm-bindgen pulls in its own pinned toolchain-sensitive dependency
    # tree (js-sys/web-sys/wasm-bindgen-macro) that only needs to resolve
    # against wasm32-unknown-unknown, and its cdylib crate-type + panic
    # hook wiring don't belong in `cargo clippy --workspace --all-features`
    # runs on the native host. Building/publishing it is a separate,
    # explicit step: `cargo build --manifest-path crates/tpt-barcode-wasm/Cargo.toml --target wasm32-unknown-unknown`
    # or `wasm-pack build crates/tpt-barcode-wasm --target web`.
    "crates/tpt-barcode-wasm",
    # pyo3's `extension-module` feature disables linking libpython, which
    # breaks `cargo build`/`cargo test` for workspace-wide commands.
    "crates/tpt-barcode-py",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.84"
authors      = ["TPT Solutions <phillip@icb.co.nz>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tpt-solutions/tpt-barcode"
homepage     = "https://github.com/tpt-solutions/tpt-barcode"
keywords     = ["barcode", "qr-code", "no-std", "embedded", "scanner"]
categories   = ["encoding", "no-std"]

[workspace.dependencies]
# Internal crates
tpt-barcode-core   = { path = "crates/tpt-barcode-core",   version = "0.1.0", default-features = false }
tpt-barcode-1d     = { path = "crates/tpt-barcode-1d",     version = "0.1.0", default-features = false }
tpt-barcode-2d     = { path = "crates/tpt-barcode-2d",     version = "0.1.0", default-features = false }
tpt-barcode-image  = { path = "crates/tpt-barcode-image",  version = "0.1.0", default-features = false }
tpt-barcode-render = { path = "crates/tpt-barcode-render", version = "0.1.0", default-features = false }

# tpt-math — crates.io primary
tpt-math-numeric      = { version = "0.1.0", default-features = false }
tpt-math-linalg-fixed = { version = "0.1.0", default-features = false }
tpt-math-geometry     = { version = "0.1.1", default-features = false }

# External
# Capped below 0.25.7: newer image releases pull in moxcms, which requires
# edition2024 and breaks the 1.84 MSRV build.
image = { version = ">=0.25, <0.25.7", default-features = false }
