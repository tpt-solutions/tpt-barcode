[package]
name        = "tpt-barcode-image"
description = "Image processing pipeline for barcode scanning: adaptive binarization, finder detection, and zero-allocation homography — no_std compatible"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
keywords   = ["barcode", "image-processing", "binarization", "detector", "no-std"]
categories  = ["no-std", "computer-vision", "multimedia::images"]
repository.workspace  = true
homepage.workspace    = true


[features]
default = ["std"]
std     = [
    "alloc",
    "tpt-barcode-core/std",
    "tpt-math-geometry/std",
    "tpt-math-linalg-fixed/std",
    "dep:image",
]
alloc   = [
    "tpt-barcode-core/alloc",
    "tpt-math-geometry/alloc",
    "tpt-math-linalg-fixed/alloc",
]
# SIMD-accelerated binarization code paths
simd    = []

[dependencies]
tpt-barcode-core      = { workspace = true }
tpt-math-linalg-fixed = { workspace = true }
tpt-math-geometry     = { workspace = true }
image                 = { workspace = true, optional = true }
